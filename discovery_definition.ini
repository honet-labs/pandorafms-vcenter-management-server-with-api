[discovery_extension_definition]
short_name = pandorafms.vmware_vcenter_services
section = app
name = "VMware vCenter Services - Friendly Names"
version = "1.5"
description = "Monitor vCenter services health/state via REST /api/vcenter/services, expose API HTTP status, and name modules using human-friendly vCenter service names."
execution_file[_exec1_] = "pandorafms_vcenter_services.py"
exec[] = "/usr/bin/python3 _exec1_ -H '_host_' -u '_user_' -p '_password_' -A '_agent_' --group_id '__taskGroupID__' --interval '__taskInterval__' --verify_ssl '_verifyssl_'"

[config_steps]
name[1] = "vCenter connection"
custom_fields[1] = vcenter_services_basic
fields_columns[1] = 2

[vcenter_services_basic]
macro[1] = _host_
name[1] = "vCenter Host/IP"
type[1] = string
placeholder[1] = "10.10.6.250"

macro[2] = _user_
name[2] = "Username"
type[2] = string
placeholder[2] = "administrator@vsphere.local"

macro[3] = _password_
name[3] = "Password"
type[3] = password

macro[4] = _agent_
name[4] = "Agent name"
type[4] = string
placeholder[4] = "VC-10.10.6.250"
required_field[4] = false

macro[5] = _verifyssl_
name[5] = "Verify SSL cert - enable if your vCenter has a trusted certificate"
type[5] = checkbox
required_field[5] = false
